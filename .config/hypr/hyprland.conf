# REGRAS DE FLOAT
# Adicione as classes de apps que devem flutuar (ex: calculadoras, popups)
# não funcionam direito nenhuma regra de float
windowrule {
    name = floating-apps
    match:class = (Qalculate!|Okular|pavucontrol|nm-connection-editor|blueman-manager|org.gnome.Calculator|confirm|dialog|download|notification|error|splash)
    float = on
    center = on
}
# Regra para Janelas de "Redigir" do E-mail flutuarem
windowrule {
    name = mail-compose-float
    match:class = thunderbird
    match:title = (Redigir|Compose)
    float = on
}
# Essas regras de FLOAT abaixo funcionam!
windowrule = match:class ^(org\.kde\.okular)$, float 1, center 1
windowrule = match:class ^(kitty)$, float 1, center 1
windowrule = match:class ^(org\.xfce\.ristretto)$, float 1, center 1
windowrule = match:class ^(org\.mozilla\.Thunderbird)$, match:title ^(Escrever:), float 1
windowrule = match:class ^(vlc)$, float 1, center 1
windowrule = match:class ^(org\.kde\.dolphin)$, float 1, center 1, size {80 80}
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float 1, size {700 500}
windowrule = match:class ^(qalculate-gtk)$, float 1,
#windowrule = match: ^()$, float 1,
#windowrule = match:class ^()$, float 1,
#windowrule = match:class ^()$, float 1,

