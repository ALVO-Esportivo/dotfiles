# --- ATALHOS DE SISTEMA ---

bind = $mod, Return, exec, $terminal                    # abre o Terminal
bind = $mod, Q, killactive                              # fecha a janela ativa
bind = $mod, R, exec, $menu                             # abre o menu de aplicações
bind = $mod, E, exec, $fileManager                      # abre o Gerenciador de Arquivos
bind = $mod, V, togglefloating                          # coloca o app ativo em modo float
bind = $mod, F, fullscreen                              # coloca o espço de trabalho atual em tela cheia
bind = $mod, L, exec, hyprlock                          # bloqueia o sistema
bind = $mod, X, exec, ~/powermenu.sh                    # "botão" de energia
bind = $mod, P, pseudo,                                 # não faço a menor idéia do que essa conf faz
#bind = $mod, J, togglesplit,                            # não faço ideia
bind = $mod, T, exec, $mail                             # inicia o aplicativo de e-mail
#bind = $mod, M, exit,                              confirmar como é essa "saída"
bind = $mod SHIFT, W, exec, pkill waybar; waybar &      # Reinicia o waybar
bind = $mod SHIFT, N, exec, swaync-client -t            # Notificações


# Screenshots
bind = , PRINT, exec, hyprshot -m region
bind = $mod_SHIFT, PRINT, exec, hyprshot -m window


# --- NAVEGAÇÃO (FOCO) ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

