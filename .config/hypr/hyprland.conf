# =============================================================================
# HYPRLAND CONFIG - OTIMIZADO PARA i3(2013)
# =============================================================================


# source = ~/.config/hypr/profiles/default.conf


#################
### MONITORES ###
#################

monitor = VGA-1, 1920x1080@60, -1920x0, 1
monitor = LVDS-1, 1366x768@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1366x0, 1
monitor = , preferred, auto, auto


# --- VARIÁVEIS DE AMBIENTE E APPS ---
$mod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun
$bar = waybar
$scripts = ~/scripts
$mail = thunderbird-launch
$cal =  # colocar no futuro o app de agenda aqui
local filemanager = "thunar"

# --- AUTOSTART ---
#exec-once = $bar
exec-once = swaync
exec-once = $terminal #[workspace name:Terminal] $terminal
exec-once = nm-applet --indicator
exec-once = swww init
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sleep 1 && waybar

# --- INPUT & PERFORMANCE ---
input {
    kb_layout = br
    kb_variant = abnt2
    kb_options = terminate:ctrl_alt_bksp  # Ctrl+Alt+Backspace para matar X (ainda não sei o que faz)
    numlock_by_default = true
#    resolve_binds_by_sym = false
    repeat_rate = 25
    repeat_delay = 600
    follow_mouse = 1
    sensitivity = 0 # -1.0 a 1.0, 0 é padrão

    touchpad {
        natural_scroll = no
        disable_while_typing = true
        clickfinger_behavior = false
        middle_button_emulation = false
        tap-to-click = true
        drag_lock = false
    }
}

gestures {
#    workspace_swipe = off false sintaxe dessa linha está errada!!!
}

general {
    gaps_in = 0 # distância entre apps
    gaps_out = 0 # distância da borda
    border_size = 1 # Um mínimo de borda ajuda a ver qual janela está focada
    col.active_border = rgba(33ccffee) # cor da borda ativa
    col.inactive_border = rgba(595959aa) # cor da borda inativa
    resize_on_border = true # permite o redimensionamento quando está na borda
    extend_border_grab_area = 15 # área para fora da borda onde é possível redimensionar
    hover_icon_on_border = true # true ou false | ponteiro do mouse muda quando está em cima de uma área  redimensionável
# Layout dwindle (split automático)
    layout = dwindle #opções: dwindle / master / scrolling / monocle

# não faço a menor idéia do que essas conf abaixo fazem
#    locale =
    resize_corner = 0
    col.nogroup_border = 0xffffaaff
    col.nogroup_border_active = 0xffff00ff #
    float_gaps = 0 #
    gaps_workspaces = 0 #
    no_focus_fallback = false
# Permitir tearing para performance (opcional)
    allow_tearing = true
    modal_parent_blocking = false
    snap {
        enabled = false
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
        respect_gaps = false
    }
}

decoration {
    rounding = 0 # cantos de tela ficam arredondados, 0 = quadrado
# não faço a menor idéia do que essas conf abaixo fazem
#    rounding_power = 2.0
#    active_opacity = 1.0
#    fullscreen_opacity = 1.0
#    dim_modal = false
#    dim_inactive = false
#    dim_strength = 0.5
#    dim_special = 0.2
#    dim_around = 0.4
#    screen_shader =
#    border_part_of_window =

    blur {
        enabled = false
        size = 0
        passes = 0
        #ignore_opacity = true
        new_optimizations = true
        xray = false
        #noise = 0.0117
        #contrast = 0.8916
        #brightness = 0.8172
        #vibrancy = 0.1696
        #vibrancy_darkness = 0.0
        #special = false
        popups = false
        #popups_ignoredalpha = 0.2
        input_methods = false
        #input_methods_ignorealpha = 0.2

    }

    shadow {
        enabled = false
        range = 4
        render_power = 3
        sharp = false
        color = rgba(1a1a1aee)
        #color_inactive = unset
        #offset = [0, 0]
        #scale = 1.0
    }
 }

# Animações
animations {
    enabled = false
    workspace_wraparound = false
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# não faço a menor idéia do que essa conf abaixo faz
dwindle {
	preserve_split = yes
	force_split = 0
}

# Layout Master # não faço a menor idéia do que essa conf abaixo faz
master {
    new_status = master
    new_on_top = false
    mfact = 0.55
}

# não faço a menor idéia do que essas conf abaixo faz
misc {
    disable_hyprland_logo = false # desabilita o imagem de fundo de tela / wallpaper
    disable_splash_rendering = true
#    force_default_wallpaper = 0 # -1 ou 1 | parece que é sobre alteração automática
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

