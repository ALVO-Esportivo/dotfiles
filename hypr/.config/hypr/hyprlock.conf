# ==========================================
# GERAL & PERFORMANCE
# ==========================================
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = true
}

# ==========================================
# PLANO DE FUNDO
# Fundo sólido plano: renderização instantânea (0ms), sem overhead de GPU
# ==========================================
background {
    monitor =
    color = rgba(17, 17, 27, 1.0) # #11111b (mesmo tom do Waybar)
}

# ==========================================
# RELÓGIO (HORA)
# ==========================================
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

# ==========================================
# DATA
# ==========================================
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgba(108, 112, 134, 1.0)
    font_size = 14
    font_family = monospace
    position = 0, 30
    halign = center
    valign = center
}

# ==========================================
# CAMPO DE SENHA
# ==========================================
input-field {
    monitor =
    size = 220, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    # Cores
    outer_color = rgba(49, 50, 68, 1.0)
    inner_color = rgba(24, 24, 37, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    check_color = rgba(249, 226, 175, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##6c7086">Senha...</span>

    position = 0, -50
    halign = center
    valign = center
}
